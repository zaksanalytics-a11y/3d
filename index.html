<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Build Studio — Zak&#39;s Building Group</title>
<style>
:root{--red:#d6211f;--red2:#b81a18;--ink:#1d2227;--muted:#5f6973;--line:#e2e5e9;--soft:#f4f5f7;--side:392px;--r:10px;--font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--font);color:var(--ink);background:var(--soft);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* header */
#top{height:60px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px 0 16px;background:#fff;border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.brand img{height:40px;width:auto;display:block}
.brand .app{font-weight:700;font-size:17px;letter-spacing:.1px;padding-left:12px;border-left:1px solid var(--line);white-space:nowrap}
.tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb{border:1px solid transparent;background:none;border-radius:8px;height:36px;padding:0 11px;font-weight:600;color:#38414a}
.tb:hover{background:var(--soft)}
.tb:disabled{opacity:.35;cursor:default;background:none}
.tb.icon{width:36px;padding:0;font-size:18px}
.cta{background:var(--red);color:#fff;border:0;border-radius:999px;height:38px;padding:0 20px;font-weight:700;letter-spacing:.2px}
.cta:hover{background:var(--red2)}
#body{flex:1;display:flex;min-height:0}
/* side panel */
#steps,#stepNav{display:none!important}#side #stepBody{padding:0 0 24px;background:#eceef1}.acctop{background:#fff;padding:16px 16px 12px;border-bottom:1px solid var(--line)}.accq{display:flex;align-items:center;gap:8px}.accquote{flex:1;height:48px;border:0;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:16px;letter-spacing:.1px;box-shadow:0 1px 2px rgba(0,0,0,.12)}.accquote:hover{background:var(--red2)}.accheart{width:42px;height:42px;flex:none;border:0;background:none;color:var(--red);display:grid;place-items:center;border-radius:50%}.accheart:hover{background:var(--soft)}.acclink{border:0;background:none;color:#1a6fb5;text-decoration:underline;font-size:13px;padding:10px 0 0 2px;display:flex;align-items:center;gap:8px}.acclink svg{flex:none}.accs{background:#fff;margin-top:6px}.acch{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:#fff;padding:0 22px 0 24px;min-height:76px;font-size:19px;font-weight:400;color:#2b3238;text-align:left}.acch:hover{background:#fafbfc}.acch .pl{position:relative;width:22px;height:22px;flex:none}.acch .pl::before,.acch .pl::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#2b3238;border-radius:2px;transition:transform .2s}.acch .pl::after{transform:rotate(90deg)}.accs.open .acch .pl::after{transform:rotate(0deg)}.accs.open .acch{font-weight:600}.accb{padding:2px 22px 24px 24px}.accb>div>h2:first-child{display:none}

#side{width:var(--side);flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:4}
#steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 10px 8px;border-bottom:1px solid var(--line)}
#steps button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;border-radius:8px;padding:6px 2px;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.15;text-align:center}
#steps button b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted);font-size:12px;border:1px solid var(--line)}
#steps button.done b{background:#fff;color:var(--red);border-color:var(--red)}
#steps button.on{color:var(--ink);background:var(--soft)}
#steps button.on b{background:var(--red);color:#fff;border-color:var(--red)}
#stepBody{flex:1;overflow-y:auto;padding:18px 20px 28px;scrollbar-width:thin}
#stepNav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#fff}
#stepNav span{font-size:12px;color:var(--muted)}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.2px}
h3{font-size:13px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.sub{margin:0 0 16px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;height:38px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#c5cbd1;background:var(--soft)}
.btn.primary,.btn.cta{background:var(--red);border-color:var(--red);color:#fff;border-radius:8px}
.btn.primary:hover,.btn.cta:hover{background:var(--red2)}
.btn.ghost{border-color:transparent}
.btn.danger{color:var(--red2)}
.btn.wide{width:100%;margin-top:12px}
.btn:disabled{opacity:.4;cursor:default}
/* rows */
.row{display:grid;grid-template-columns:1fr;gap:6px;margin:14px 0}
.row>label{font-weight:600;display:flex;justify-content:space-between}
.row select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff}
.ctl{display:flex;align-items:center;gap:12px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--red) var(--p,0%),#dfe3e7 var(--p,0%));outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--red);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:grab}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--red);cursor:grab}
.numwrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;height:36px;padding-right:8px;background:#fff}
.numwrap i{font-style:normal;color:var(--muted);font-size:12px}
.num{width:58px;border:0;height:34px;padding:0 4px 0 10px;background:none;-moz-appearance:textfield}
.num::-webkit-inner-spin-button{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;height:32px;padding:0 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chips button.on,.chips button:hover{border-color:var(--ink)}
.dots{display:inline-flex}.dots i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.2);margin-left:-3px}.dots i:first-child{margin-left:0}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;gap:3px;margin:12px 0}
.seg button{flex:1;border:0;background:none;border-radius:7px;height:32px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.parts{flex-wrap:wrap}.seg.parts button{flex:1 0 30%}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px}
.cards.three{grid-template-columns:repeat(3,1fr)}
.card{border:1.5px solid var(--line);background:#fff;border-radius:var(--r);padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.card:hover{border-color:#c5cbd1}
.card.on{border-color:var(--red);box-shadow:0 0 0 3px rgba(214,33,31,.12)}
.card small{color:var(--muted);font-size:12px;line-height:1.3}
.card em{font-style:normal;color:var(--red);font-weight:700;font-size:12.5px}
.card .ico{color:var(--ink);width:56px;height:38px;display:block;margin-bottom:4px}
.card.on .ico{color:var(--red)}
.thumb{display:block;height:44px;border-radius:7px;margin-bottom:6px}
.scene.prairie .thumb{background:linear-gradient(#7fb0e3 0 55%,#e9eef2 55% 58%,#7d9a4d 58%)}
.scene.farmyard .thumb{background:linear-gradient(#86b4e2 0 45%,#2f4a2e 45% 58%,#7d9a4d 58%)}
.scene.winter .thumb{background:linear-gradient(#c4d2e0 0 45%,#6d8572 45% 55%,#f1f4f8 55%)}
.scene.evening .thumb{background:linear-gradient(#4d5a86 0,#e7926b 45%,#f2c58f 55%,#55623f 58%)}
.scene.rocky .thumb{background:linear-gradient(#7a9cc4 0 30%,#5f6f78 30% 38%,#3f5236 38% 58%,#7d9a4d 58%)}
.scene.studio .thumb{background:linear-gradient(#eceef0 0 58%,#d4d6d9 58%)}
.cards.tmpl{grid-template-columns:repeat(3,1fr)}
.cards.tmpl .card{min-height:104px;padding:14px}
.cards.tmpl .card b{font-size:15px}
.swatches,.vcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:7px;margin:8px 0}
.swatch{aspect-ratio:1;border-radius:8px;border:1px solid rgba(0,0,0,.18);background:var(--c);position:relative}
.swatch.on{outline:3px solid var(--red);outline-offset:2px}
.swatch:hover{transform:scale(1.06)}
.current{display:flex;align-items:center;gap:8px;margin:6px 0 0;color:var(--muted)}
.current i{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.2)}
.current b{color:var(--ink)}
.toggle{margin:12px 0}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle label{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.toggle .sw{width:38px;height:22px;border-radius:999px;background:#cfd4d9;position:relative;flex:none;transition:background .15s}
.toggle .sw:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.toggle input:checked+label .sw{background:var(--red)}
.toggle input:checked+label .sw:after{left:19px}
.toggle input:focus-visible+label .sw{outline:2px solid #1a73e8;outline-offset:2px}
.toggle small{display:block;color:var(--muted);margin:2px 0 0 48px}
.stat{margin:10px 0 0;padding:9px 12px;background:var(--soft);border-radius:8px;font-weight:600;color:#38414a}
.note{color:var(--muted);background:var(--soft);padding:10px 12px;border-radius:8px}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:2px 14px;margin:0 0 10px}
.panel.on{border-color:#cfd4d9;background:#fcfcfd}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.addgrid button{border:1px dashed #c3c9cf;background:#fff;border-radius:8px;min-height:40px;padding:6px 10px;text-align:left;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.addgrid button b{color:var(--red);font-size:17px;line-height:1}
.addgrid button:hover{border-style:solid;border-color:var(--red)}
.list{list-style:none;margin:10px 0;padding:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list li{display:flex;align-items:center;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li.on{background:#fff6f5}
.list li.empty{padding:12px;color:var(--muted)}
.lnk{flex:1;border:0;background:none;text-align:left;padding:9px 12px;display:flex;flex-direction:column}
.lnk small{color:var(--muted)}
.x{border:0;background:none;width:38px;height:38px;font-size:20px;color:var(--muted);border-radius:8px}
.x:hover{background:var(--soft);color:var(--ink)}
/* wall picker */
.wallpick{position:relative;height:150px;margin:4px 0 6px}
.wpbody{position:absolute;left:62px;right:62px;top:34px;bottom:34px;border:2px solid #9aa3ab;border-radius:4px;background:repeating-linear-gradient(90deg,#f3f4f6 0 6px,#eceef1 6px 7px);display:grid;place-items:center;color:var(--muted);font-weight:600;font-size:12px}
.wp{position:absolute;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-weight:600;font-size:12px;padding:5px 9px;z-index:1}
.wp em{font-style:normal;background:var(--ink);color:#fff;border-radius:999px;padding:0 6px;margin-left:6px;font-size:11px}
.wp.on{border-color:var(--red);color:var(--red);box-shadow:0 0 0 3px rgba(214,33,31,.12)}
.wp.back{top:0;left:50%;transform:translateX(-50%)}
.wp.front{bottom:0;left:50%;transform:translateX(-50%)}
.wp.left{left:0;top:50%;transform:translateY(-50%)}
.wp.right{right:0;top:50%;transform:translateY(-50%)}
/* quote */
.summary{border:1px solid var(--line);border-radius:var(--r);margin:0 0 14px}
.summary summary{padding:10px 12px;font-weight:700;cursor:pointer}
.summary table,.page table{width:100%;border-collapse:collapse;font-size:12.5px}
.summary th,.summary td{text-align:left;vertical-align:top;padding:6px 12px;border-top:1px solid var(--line)}
.summary th{width:34%;color:var(--muted);font-weight:600}
.fld{display:flex;flex-direction:column;gap:4px;margin:0 0 10px}
.fld label{font-weight:600;font-size:13px}
.fld input,.fld select,.fld textarea{border:1px solid #cfd4d9;border-radius:8px;padding:9px 10px;background:#fff;min-height:40px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid rgba(214,33,31,.35);border-color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fine{font-size:12px;color:var(--muted)}
.err{color:var(--red2);font-weight:600;min-height:1em;margin:4px 0}
.done h2{margin-top:8px}
/* viewport */
#view{position:relative;flex:1;min-width:0;background:#cfd9e3}
#c{display:block;width:100%;height:100%;touch-action:none;outline:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;z-index:9;font-weight:600;color:var(--muted)}
#loading img{height:90px;display:block;margin:0 auto 12px}
#cams{position:absolute;left:14px;top:14px;display:flex;flex-wrap:wrap;gap:6px;z-index:2;max-width:calc(100% - 28px)}
#cams button{border:0;height:32px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.18);font-weight:600;font-size:12.5px;color:#2b3238}
#cams button:hover{background:#fff}
#cams button.on{background:var(--ink);color:#fff}
#topView{position:absolute;inset:0;background:#eef0f2;z-index:1}
#topView svg{width:100%;height:100%;display:block}
#topView .cap{position:absolute;right:14px;top:14px;font-size:12px;color:#555;background:rgba(255,255,255,.85);padding:5px 10px;border-radius:12px}
.planbox svg{width:100%;height:auto;display:block;border-radius:8px}
#cams button.det{background:var(--red);color:#fff}
#cams button.det:hover{background:var(--red2)}
.dtable{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 10px}.dtable th,.dtable td{text-align:left;vertical-align:top;padding:7px 9px;border:1px solid var(--line)}.dtable th{width:34%;background:var(--soft);font-weight:600}
#cams .sep{width:1px;background:rgba(255,255,255,.6);margin:4px 2px}
#dims{position:absolute;left:14px;bottom:14px;background:rgba(29,34,39,.78);color:#fff;border-radius:8px;padding:6px 11px;font-weight:600;font-size:12.5px;z-index:2}
#bAbout{position:absolute;right:12px;bottom:12px;border:0;background:rgba(255,255,255,.75);border-radius:6px;font-size:11.5px;padding:4px 8px;color:#38414a;z-index:2}
#bPanel{display:none}
#sel{position:absolute;right:14px;top:14px;width:300px;max-height:calc(100% - 70px);overflow:auto;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.22);padding:12px 14px 14px;z-index:3}
.selhead{display:flex;align-items:center;gap:8px;margin:-2px -6px 2px 0}
.selhead b{font-size:15px}
.selhead span{color:var(--muted);font-size:12px;margin-right:auto}
#sel .row{margin:10px 0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btns .btn{flex:1}
/* modal */
#modal{position:fixed;inset:0;background:rgba(18,22,26,.5);display:flex;align-items:flex-start;justify-content:center;padding:7vh 14px;overflow:auto;z-index:20}
.dlg{position:relative;background:#fff;border-radius:14px;width:100%;max-width:560px;padding:22px 24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg:has(.tmpl){max-width:760px}
.dlg .close{position:absolute;right:10px;top:10px}
.dlg h2{margin-bottom:8px;padding-right:30px}
.dlg .mono,textarea.mono{width:100%;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--soft)}
.tips{padding-left:18px;line-height:1.7}
.credits{font-size:12px;color:var(--muted);padding-left:18px;margin:4px 0 10px;columns:2;column-gap:20px}.credits li{break-inside:avoid;margin-bottom:2px}.credits a{color:inherit}
.saverow{display:flex;gap:8px}.saverow input{flex:1;border:1px solid #cfd4d9;border-radius:8px;padding:0 10px;height:38px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;transition:.25s;pointer-events:none;max-width:90vw}
#toast.on{transform:translate(-50%,0);opacity:1}
/* spec sheet */
#sheet{position:fixed;inset:0;background:#e9ecef;overflow:auto;z-index:25;padding:0 12px 40px}
.sbar{position:sticky;top:0;display:flex;gap:8px;justify-content:center;padding:12px;background:#e9ecef;z-index:1}
.page{background:#fff;max-width:820px;margin:0 auto;padding:30px 34px;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.shead{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:16px}
.shead img{height:64px}
.shead div{text-align:right;display:flex;flex-direction:column}
.shead b{font-size:20px}
.shot{width:100%;border-radius:8px;display:block}
.cols{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;margin:18px 0;align-items:start}
.page th,.page td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line)}
.page th{width:32%;color:var(--muted)}
.page .link{word-break:break-all}
.page footer{border-top:1px solid var(--line);padding-top:10px;margin-top:12px;font-size:12px;text-align:center;color:var(--muted)}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #app,#modal,#toast,.noprint{display:none!important}
  #sheet{position:static;padding:0;background:#fff;overflow:visible}
  .page{box-shadow:none;max-width:none;padding:0}
  .shot{max-height:120mm;object-fit:cover}
  .cols{break-inside:avoid}
}
/* small screens: options become a bottom sheet */
@media (max-width:820px){
  #top{height:54px;padding:0 8px 0 10px;gap:8px}
  .brand img{height:32px}.brand .app{display:none}
  .cta{white-space:nowrap}
  #bAbout{display:none}
  .tools .hide-sm{display:none}
  .cta{padding:0 14px;height:34px;font-size:13px}
  #body{flex-direction:column-reverse}
  #side{width:auto;height:52vh;border-right:0;border-top:1px solid var(--line)}
  body.collapsed #side{display:none}
  #bPanel{display:block;position:absolute;right:12px;bottom:12px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;padding:8px 14px;z-index:3}
  #sel{left:10px;right:10px;width:auto;top:auto;bottom:56px;max-height:55%}
  .cards.tmpl{grid-template-columns:1fr 1fr}
  #steps{grid-template-columns:repeat(8,minmax(64px,1fr));overflow-x:auto}
  .cols{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
